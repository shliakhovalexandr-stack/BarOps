<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<!-- Заборона авто-перекладу Chrome/браузера: застосунок завжди українською
     (інакше машинний переклад калічить — «Повар», «Солнце» замість «неділя» тощо) -->
<meta name="google" content="notranslate"/>
<!-- Тема: застосувати ще ДО CSS, щоб не блимало темним при світлій темі -->
<script>
(function(){
  try {
    var t = localStorage.getItem('barops_theme') || 'dark';
    var dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
    var light = t === 'light' || (t === 'system' && !dark);
    document.documentElement.classList.toggle('light', light);
  } catch(e){}
})();
</script>
<script>
/* ── BarOps: ловилка помилок ──────────────────────────────────────────────
   КЛАСИЧНИЙ інлайн-скрипт у <head>, до всіх модулів — свідомо, не з ліні.
   Увесь застосунок це ОДИН модульний граф: bootstrap робить top-level await на
   34 імпорти без .catch(), і всі 34 сторінки тягнуть shared/app.js. Якщо app.js
   не виконається (localStorage кидає в приватному режимі) або хоч один модуль не
   доїде мережею бару — не рендериться НІЧОГО, людина бачить вічний спінер, а ми
   не дізнаємось. Логер-модуль тут безсилий: він у тому ж графі.
   Тому: ловимо тут, посилаємо збереженими посиланнями на fetch/sendBeacon. */
(function () {
  var API = 'https://barops-backend-production.up.railway.app';   // абсолютний! /api/* на Netlify переписується на функції
  var BUILD = 'barops-v318';
  window.__BAROPS_BUILD = BUILD;

  var _fetch  = window.fetch && window.fetch.bind(window);
  var _beacon = navigator.sendBeacon && navigator.sendBeacon.bind(navigator);
  var _err    = (window.console && console.error) ? console.error.bind(console) : function () {};

  /* Прочищення секретів. Дзеркало src/lib/redact.js на бекенді — тримати синхронно.
     Найважливіше: Syrve кладе токен просто в адресу (?key=<40 hex>), а пароль —
     як ?pass=<sha1>. У localStorage лежать JWT і refresh-токен. */
  var RULES = [
    [/([?&](?:key|pass|password|token|secret|api[-_]?key|access_token|apiKey|chatId|pin|licenseKey|login)=)[^&\s"'#\\]*/gi, '$1[REDACTED]'],
    [/(?:\/bot)?\d{8,10}:[A-Za-z0-9_-]{30,}/g, '/bot[TG_BOT_TOKEN]'],
    [/\beyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}/g, '[JWT]'],
    [/\b(Bearer|iikoToken|Basic|Token)\s+[A-Za-z0-9._~+/=-]{8,}/gi, '$1 [REDACTED]'],
    [/\bbops_(live|test)_[A-Za-z0-9]{6,}/g, 'bops_$1_[REDACTED]'],
    [/\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}/g, '[BCRYPT]'],
    [/\b[0-9a-f]{64}\b/gi, '[HEX64]'],
    [/\b[0-9a-f]{40}\b/gi, '[HEX40]'],
    [/data:([a-z]+)\/[a-z.+-]{2,20};base64,[A-Za-z0-9+/=\s]{16,}/gi, 'data:$1/*;base64,[REDACTED]'],
    [/\b[\w.+-]+@[\w-]+\.[\w.]{2,}\b/g, '[EMAIL]'],
    [/\+380\d{9}\b/g, '[PHONE]'],
  ];
  function redact(v, max) {
    var s = v == null ? '' : String(v);
    try { for (var i = 0; i < RULES.length; i++) s = s.replace(RULES[i][0], RULES[i][1]); } catch (e) {}
    max = max || 2000;
    return s.length > max ? s.slice(0, max) + '…' : s;
  }
  window.__baropsRedact = redact;

  function ls(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

  /* Контекст. Ніколи не кидає й не припускає, що app.js завантажився.
     ⚠ З localStorage читаємо ЛИШЕ роль і заклад — ніколи токен. */
  function ctx() {
    var b = window.__barops, st = (b && b.state) || {};
    var el = document.querySelector('.phone-frame');
    return {
      page:       (el && el.dataset && el.dataset.page) || st.route || 'boot',
      role:       String(st.role || ls('barops_role') || '').toLowerCase(),
      venueId:    st.venueId || ls('barops_venueId') || '',
      userName:   String(st.userName || '').slice(0, 80),
      appVersion: BUILD,
      online:     navigator.onLine !== false,
    };
  }

  /* Хлібні крихти: лише ФОРМА дії, ніколи вміст. У полях форм лежать паролі POS. */
  var crumbs = [];
  function crumb(type, info) {
    try {
      crumbs.push({ t: Date.now() % 1e7, type: type, info: String(info || '').slice(0, 80) });
      if (crumbs.length > 20) crumbs.shift();
    } catch (e) {}
  }
  window.__baropsCrumb = crumb;
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-a],button,a') : null;
    if (t) crumb('click', (t.dataset && t.dataset.a) || t.tagName);
  }, true);

  /* Запобіжники, щоб цикл помилок не завалив ні пристрій, ні базу. */
  var perSig = {}, sentTotal = 0, suppressed = 0, busy = false, queue = [];
  var MAX_PER_SIG = 20, MAX_TOTAL = 50;

  function sigOf(msg, stack) {
    var s = (String(msg).replace(/\d+/g, '#').slice(0, 120)) + '|' + String(stack || '').split('\n')[1];
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return String(h);
  }

  function report(name, message, stack, kind) {
    if (busy) return;                                   // логер не логує сам себе
    busy = true;
    try {
      var sig = sigOf(message, stack);
      perSig[sig] = (perSig[sig] || 0) + 1;
      if (perSig[sig] > MAX_PER_SIG || sentTotal >= MAX_TOTAL) { suppressed++; return; }
      sentTotal++;
      var c = ctx();
      queue.push({
        name: String(name || 'Error').slice(0, 60),
        message: redact(message),
        stack: redact(stack, 4000),
        kind: kind || 'error',
        page: c.page, role: c.role, venueId: c.venueId, userName: c.userName,
        appVersion: c.appVersion, online: c.online,
        breadcrumbs: crumbs.slice(-20),
        suppressedCount: suppressed || undefined,
      });
      schedule();
    } catch (e) { _err('[logger]', e && e.message); } finally { busy = false; }
  }
  window.__baropsReport = report;

  var timer = null;
  function schedule() { if (!timer) timer = setTimeout(flush, 2000); }
  function flush() {
    timer = null;
    if (!queue.length) return;
    var batch = queue.splice(0, 20);
    var body = JSON.stringify({ events: batch });
    try {
      var tok = ls('barops_token');
      if (!tok && _beacon) { _beacon(API + '/api/logs/client', new Blob([body], { type: 'text/plain' })); return; }
      if (_fetch) {
        _fetch(API + '/api/logs/client', {
          method: 'POST', keepalive: true,
          headers: { 'Content-Type': 'application/json', Authorization: tok ? 'Bearer ' + tok : '' },
          body: body,
        }).catch(function () {});                        // мовчки: збій відправки логів не має нічого ламати
      } else if (_beacon) {
        _beacon(API + '/api/logs/client', new Blob([body], { type: 'text/plain' }));
      }
    } catch (e) { _err('[logger flush]', e && e.message); }
  }
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });

  /* Гачки. Синхронні кидки — error; асинхронні (а це ~123 інлайн-обробники,
     що викликають async-функції) — лише unhandledrejection. Потрібні обидва. */
  addEventListener('error', function (e) {
    if (e && e.target && e.target !== window && e.target.tagName) {   // не доїхав ресурс
      report('ResourceError', 'не завантажився ' + e.target.tagName + ': ' + (e.target.src || e.target.href || ''), '', 'error');
      return;
    }
    var err = e && e.error;
    report(err && err.name, (err && err.message) || (e && e.message), err && err.stack);
  }, true);
  addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    report(r && r.name, (r && r.message) || String(r), r && r.stack);
  });

  /* Сторож: якщо через 8 с після завантаження застосунок так і не піднявся —
     кажемо про це серверу і показуємо екран помилки замість вічного спінера. */
  addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      if (window.__barops) return;
      report('BootstrapFailed', 'застосунок не піднявся за 8 с (модулі не завантажились?)', '', 'invariant');
      flush();
      try {
        var l = document.getElementById('app-loading');
        if (l) {
          l.innerHTML = '<div class="error-screen"><h2>Не вдалося завантажити</h2>'
            + '<p>Перевірте інтернет і спробуйте ще раз. Якщо не допомогло — закрийте застосунок і відкрийте знову.</p>'
            + '<button onclick="location.reload()" style="margin-top:14px;height:44px;padding:0 20px;border-radius:12px;border:0;background:var(--green,#4ade80);color:#000;font-size:14px;font-weight:600;cursor:pointer">Спробувати ще раз</button></div>';
        }
      } catch (e) {}
    }, 8000);
  });
})();
</script>
<title>BarOps</title>
<meta name="description" content="Розумний помічник для барменів: інвентаризація, накладні, списання"/>
<meta name="theme-color" content="#000000"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="BarOps"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>

<!-- ── Fonts — Geist (латиниця) + Inter (кирилиця, бо Geist її НЕ має → інакше tofu/квадрати) ── -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<!-- Lucide icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<!-- ── Shared styles ── -->
<link rel="stylesheet" href="shared/tokens.css"/>
<link rel="stylesheet" href="shared/components.css"/>
<link rel="stylesheet" href="shared/tab-bar.css"/>

<style>
/* ────────────────────────────
   HOST PAGE LAYOUT
──────────────────────────── */
html, body {
  height: 100%;
  overflow: hidden;
  /* без pull-to-refresh / overscroll-«стрибка» на рівні документа (Android APK/TWA) */
  overscroll-behavior: none;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: var(--bg);
  transition: background-color .25s ease;
}

/* ── Aurora removed ── */
.aurora-blob { display: none; }

/* ────────────────────────────
   PHONE FRAME
──────────────────────────── */
#phone {
  position: relative; z-index: 1;
  width: var(--phone-w);
  background-color: var(--bg);
  transition: background-color .25s ease;
  border-radius: var(--r-phone);
  border: 0.5px solid var(--border);
  box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  height: 844px;
  overflow: hidden;
  animation: frameIn .5s var(--ease-spring) both;
}
@keyframes frameIn {
  from { opacity: 0; transform: translateY(18px) scale(.98); }
  to   { opacity: 1; transform: none; }
}

/* На мобільному — повний екран */
@media (max-width: 500px) {
  body { align-items: stretch; justify-content: flex-start; overflow: hidden; }
  #phone {
    width: 100vw;
    height: 100dvh;
    border-radius: 0;
    border: none;
    box-shadow: none;
    animation: none;
  }
  #app-status-bar { display: none; }
}

/* ────────────────────────────
   ДЕСКТОПНИЙ РЕЖИМ — застосунок як повноцінне вікно на ПК
   Для керуючих/менеджерів. Телефони барменів не зачіпає (гейт по ширині).
   Ширші сторінки (графік) самі використовують місце; мобільні списки
   тримаємо читабельною колонкою по центру, щоб не розтягувало на весь монітор.
──────────────────────────── */
@media (min-width: 1024px) {
  body { padding: 24px; }
  #phone {
    width: min(1200px, 95vw);
    height: min(900px, 92vh);
    border-radius: 20px;
  }
  /* (фейковий статус-бар телефона ховаємо нижче — після базового правила,
     щоб виграти в каскаді; мобільну поведінку не чіпаємо) */

  /* За замовчуванням — читабельна колонка по центру */
  #app-view { align-items: center; }
  #app-view > * { width: 100%; max-width: 920px; }

  /* Сторінки з власною десктопною розкладкою — на всю ширину вікна */
  #phone[data-page="dashboard"]   #app-view > *,
  #phone[data-page="schedule"]    #app-view > *,
  #phone[data-page="performance"] #app-view > *,
  #phone[data-page="analytics"]   #app-view > *,
  #phone[data-page="team"]        #app-view > * { max-width: none; }

  /* ── Нижній таб-бар → верхній хедер-меню (як на сайті) ── */
  #app-tab-bar {
    order: -1;                              /* flex order: піднімаємо на верх вікна */
    justify-content: flex-start;
    gap: 2px;
    padding: 8px 18px;
    border-top: none;
    border-bottom: 0.5px solid var(--border);
  }
  /* Лого зліва — як на сайті; веде на головну */
  #app-tab-bar .tab-bar__brand {
    display: flex;
    align-items: center;
    font-family: 'Geist', 'Inter', system-ui, sans-serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: -0.045em;
    color: var(--text0);
    padding: 0 10px 0 6px;
    margin-right: 10px;
    cursor: pointer;
    user-select: none;
  }
  #app-tab-bar .tab-bar__brand span { color: var(--green); }
  /* Пункти — іконка+підпис у рядок, як навігаційні лінки */
  #app-tab-bar .tab-bar__item,
  #app-tab-bar .tab-bar__fab-wrap {
    flex-direction: row;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 10px;
    transition: background .15s;
  }
  #app-tab-bar .tab-bar__item:hover,
  #app-tab-bar .tab-bar__fab-wrap:hover { background: var(--bg2); }
  #app-tab-bar .tab-bar__item--active { background: rgba(168,139,255,0.10); }
  #app-tab-bar .tab-bar__label { font-size: 13px; font-weight: 500; }
  /* Центральна FAB стає звичайним пунктом (без «підняття» й тіні) */
  #app-tab-bar .tab-bar__fab {
    width: 28px; height: 28px; border-radius: 8px;
    margin-top: 0; box-shadow: none;
  }
  #app-tab-bar .tab-bar__fab svg { width: 16px; height: 16px; }
}

/* ────────────────────────────
   STATUS BAR
──────────────────────────── */
#app-status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 22px 6px;
  font-size: 11px;
  color: var(--text2);
  font-family: 'Geist', 'Inter', system-ui, sans-serif;
  font-weight: 500;
  letter-spacing: .02em;
  flex-shrink: 0;
}
#app-status-bar .status-bar__right {
  display: flex;
  gap: 6px;
  align-items: center;
}
/* На ПК фейковий статус-бар телефона (годинник + батарея) не потрібен.
   Стоїть ПІСЛЯ базового #app-status-bar, тож виграє каскад на десктопі.
   Мобільний (≤500px) НЕ чіпаємо — телефон працює як раніше. */
@media (min-width: 1024px) { #app-status-bar { display: none; } }

/* ────────────────────────────
   VIEW CONTAINER
──────────────────────────── */
#app-view {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  /* зупиняємо «протікання» скролу в браузер: без pull-to-refresh і overscroll-пружини (Android APK/TWA) */
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  transition: opacity 250ms ease, transform 250ms ease;
}
#app-view::-webkit-scrollbar { width: 0; }

/* ────────────────────────────
   LOADING SCREEN
──────────────────────────── */
#app-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 20px;
}
.loading-logo-mark {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  color: var(--text0);
}
.loading-logo-wordmark {
  font-family: 'Geist', 'Inter', system-ui, sans-serif;
  font-weight: 600;
  font-size: 28px;
  letter-spacing: -0.045em;
  color: var(--text0);
  line-height: 1;
}
.loading-logo-wordmark span { color: var(--green); }
.loading-ring {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.08);
  border-top-color: #A88BFF;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font-family: 'Geist', 'Inter', system-ui, sans-serif;
  font-size: 11px; font-weight: 500;
  color: var(--text2); letter-spacing: .06em;
}

/* ────────────────────────────
   ERROR SCREEN
──────────────────────────── */
.error-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; flex: 1; gap: 12px; padding: 32px;
  text-align: center;
}
.error-screen h2 { font-family: var(--font-h); font-size: 18px; color: var(--text0); }
.error-screen p  { font-size: 13px; color: var(--text2); font-family: var(--font-b); line-height: 1.6; }
</style>
</head>
<body>

<!-- Aurora background layer -->
<div class="aurora-blob aurora-blob--violet"></div>
<div class="aurora-blob aurora-blob--cyan"></div>
<div class="aurora-blob aurora-blob--pink"></div>

<!-- ══════════ PHONE FRAME ══════════ -->
<div id="phone">

  <!-- Status bar -->
  <div id="app-status-bar">
    <!-- Filled by app.js bootstrap() -->
    <span>21:34</span>
  </div>

  <!-- Main view container -->
  <div id="app-view">
    <!-- Loading state shown until first page renders -->
    <div id="app-loading">
      <div class="loading-logo-mark">
        <svg width="38" height="66" viewBox="0 0 52 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="18" y="1" width="16" height="9" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/>
          <line x1="19" y1="4.1" x2="33" y2="4.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="19" y1="6.9" x2="33" y2="6.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M18 10 h16 v10 c0 0 8 8 8 20 v40 a6 6 0 01-6 6 h-20 a6 6 0 01-6-6 V40 c0-12 8-20 8-20 V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
          <rect x="12" y="52" width="28" height="22" rx="4" fill="#A88BFF"/>
          <text x="26" y="68" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="14" font-weight="800" fill="#0A0A14">B</text>
        </svg>
        <div class="loading-logo-wordmark">bar<span>ops.</span></div>
      </div>
      <div class="loading-ring"></div>
      <div class="loading-text">завантаження</div>
    </div>
  </div>

  <!-- Tab bar (hidden on auth, filled by app.js) -->
  <nav id="app-tab-bar" style="display:none">
    <!-- Filled by renderTabBar() in app.js -->
  </nav>

  <!-- Drawer wrap (manager only) -->
  <div id="app-drawer-wrap"></div>

  <!-- Постійні file inputs для камери/галереї (iOS Safari сумісність) -->
  <input type="file" id="ocr-cam-input" accept="image/*" capture="environment"
    style="position:fixed;top:-100px;left:-100px;opacity:0;width:1px;height:1px"
    onchange="if(window.__ocr&&this.files[0])window.__ocr.handleFile(this)"/>
  <input type="file" id="ocr-gallery-input" accept="image/*"
    style="position:fixed;top:-100px;left:-100px;opacity:0;width:1px;height:1px"
    onchange="if(window.__ocr&&this.files[0])window.__ocr.handleFile(this)"/>

</div><!-- /phone -->

<!-- ══════════ PAGE MODULES ══════════
     Кожна сторінка — ES-модуль.
     Вони самостійно реєструють себе через registerPage().
     Підключення — тут. Решта — в page-файлі.
     ══════════════════════════════════ -->
<script type="module">
  import { bootstrap, registerPage } from './shared/app.js';

  /*
   * Стратегія: eager import усіх сторінок паралельно.
   * Модулі невеликі (~10–20 КБ кожен), тому завантажуються
   * миттєво з локального сервера або CDN.
   * navigate() гарантовано отримає готовий модуль.
   */
  const [
    authMod, dashMod, ocrMod, invMod, woffMod,
    ordMod, alertMod, shiftMod, mgrMod, teamMod, profMod,
    exciseMod, debtsMod, analyticsMod, stockMod, venueEditMod, stopListMod, scheduleMod, journalMod,
    recipeBookMod, currentShiftMod, playlistMod, invoiceOcrMod, performanceMod, digestMod, disciplineMod,
    cashMod, myShiftMod, openTablesMod, productionMod, disassemblyMod, abcMod, payAuditMod, morshMod,
  ] = await Promise.all([
    import('./pages/auth.js'),
    import('./pages/dashboard.js'),
    import('./pages/ocr.js'),
    import('./pages/inventory.js'),
    import('./pages/writeoff.js'),
    import('./pages/ordering.js'),
    import('./pages/price-alert.js'),
    import('./pages/shift-log.js'),
    import('./pages/manager.js'),
    import('./pages/team.js'),
    import('./pages/profile.js'),
    import('./pages/excise.js'),
    import('./pages/debts.js'),
    import('./pages/analytics.js'),
    import('./pages/stock.js'),
    import('./pages/venue-edit.js'),
    import('./pages/stop-list.js'),
    import('./pages/schedule.js'),
    import('./pages/journal.js'),
    import('./pages/recipe-book.js'),
    import('./pages/current-shift.js'),
    import('./pages/playlist.js'),
    import('./pages/invoice-ocr.js'),
    import('./pages/performance.js'),
    import('./pages/digest.js'),
    import('./pages/discipline.js'),
    import('./pages/cash.js'),
    import('./pages/my-shift.js'),
    import('./pages/open-tables.js'),
    import('./pages/production.js'),
    import('./pages/disassembly.js'),
    import('./pages/abc.js'),
    import('./pages/pay-audit.js'),
    import('./pages/morshynska.js'),
  ].map(function (pr, i) {
    // Без цього збій ОДНОГО модуля = вічний спінер і жодного сліду: top-level await
    // просто відхиляється, bootstrap() не викликається, екран лишається порожнім.
    return pr.catch(function (e) {
      if (window.__baropsReport) {
        window.__baropsReport('ModuleLoadError', 'не завантажився модуль #' + i + ': ' + (e && e.message), e && e.stack, 'invariant');
      }
      throw e;
    });
  }));

  /* Реєструємо кожну сторінку — простий прямий об'єкт */
  const pages = [
    ['auth',        authMod],
    ['dashboard',   dashMod],
    ['ocr',         ocrMod],
    ['inventory',   invMod],
    ['writeoff',    woffMod],
    ['ordering',    ordMod],
    ['price-alert', alertMod],
    ['shift-log',   shiftMod],
    ['manager',     mgrMod],
    ['team',        teamMod],
    ['profile',     profMod],
    ['excise',      exciseMod],
    ['debts',       debtsMod],
    ['analytics',   analyticsMod],
    ['stock',       stockMod],
    ['venue-edit',  venueEditMod],
    ['stop-list',   stopListMod],
    ['schedule',     scheduleMod],
    ['journal',      journalMod],
    ['recipe-book',  recipeBookMod],
    ['current-shift', currentShiftMod],
    ['playlist',      playlistMod],
    ['invoice-ocr',   invoiceOcrMod],
    ['performance',   performanceMod],
    ['digest',        digestMod],
    ['discipline',    disciplineMod],
    ['cash',          cashMod],
    ['my-shift',      myShiftMod],
    ['dishware',      invMod],
    ['open-tables',   openTablesMod],
    ['production',    productionMod],
    ['disassembly',   disassemblyMod],
    ['abc',           abcMod],
    ['pay-audit',     payAuditMod],
    ['morshynska',    morshMod],
  ];

  for (const [name, mod] of pages) {
    registerPage(name, mod.default);
  }

  /* Стартуємо додаток — перехід на 'auth' */
  bootstrap();
</script>

<script>
  /* Реєстрація Service Worker для PWA */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('[SW] Зареєстровано:', reg.scope))
        .catch(err => console.log('[SW] Помилка:', err));
    });
  }
</script>

</body>
</html>
